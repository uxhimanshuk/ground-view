name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: npm test

      - name: No em-dashes in html, js, css or md files
        run: |
          if grep -rlI $'\xe2\x80\x94' --include='*.html' --include='*.js' --include='*.mjs' --include='*.css' --include='*.md' --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "Em-dash (U+2014) found in the files above." >&2
            exit 1
          fi

      - name: Site size under 1 MB
        run: |
          bytes=$(find . -type f \
            -not -path './.git/*' -not -path './node_modules/*' \
            -not -path './test/*' -not -path './scripts/*' -not -path './.github/*' -not -path './docs/*' \
            -not -path './out/*' -print0 | du -cb --files0-from=- | tail -1 | cut -f1)
          echo "site bytes: $bytes"
          if [ "$bytes" -gt 1048576 ]; then
            echo "Site files exceed 1 MB." >&2
            exit 1
          fi
